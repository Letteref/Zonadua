# Secret scan — gitleaks over the repository history, on every push and pull request.
#
# Why this exists: `.gitignore` stops the *expected* secret filenames (`.env`, `.dev.vars`)
# from being committed, and it cannot stop the unexpected one — a key pasted into a config
# file, a fixture, or a scratch script under a name nobody thought to list. That is the
# failure mode this job covers, and it is why the scan reads history rather than the working
# tree: a credential that reaches the remote stays in the remote's history even after the
# line is deleted, so it has to be caught before the push, not after.
#
# The scan runs with the default rule set and no repo config file; the repository is clean
# under those rules. If a future false positive needs an exception, prefer a `gitleaks:allow`
# comment on the line or a fingerprint in `.gitleaksignore` over disabling a rule.

name: secret scan

on:
  push:
  pull_request:

# The job only reads the checkout. Nothing here needs to write to the repository.
permissions:
  contents: read

env:
  # Pinned on purpose. A scanner whose rule set changes under you is one whose "clean" result
  # means something slightly different every time; this is the version the scan was verified
  # against locally (gitleaks 8.30.1, 80 commits, 2.5 MB, no findings). Bump it as a reviewed
  # change, not as whatever the runner happens to resolve.
  GITLEAKS_VERSION: 8.30.1

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the full history
        uses: actions/checkout@v4
        with:
          # 0, not the default shallow clone: the claim being tested is "no credential has ever
          # been committed here", and a shallow clone can only ever see the latest commit.
          fetch-depth: 0

      - name: Install gitleaks ${{ env.GITLEAKS_VERSION }}
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL "$url" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version

      - name: Scan the history
        # `--exit-code 1` is the default and is what makes this job fail on a finding; it is
        # spelled out so the failure mode is visible in the file rather than implied.
        # `--redact` keeps a detected value out of the CI log, which is otherwise the first
        # place a leaked secret gets copied to.
        run: ./gitleaks git --redact --no-banner --exit-code 1 .
